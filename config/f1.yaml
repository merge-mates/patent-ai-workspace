# F1 단계별 모델 설정 (core/llm이 읽는다). 가격 키는 모르니 넣지 않는다 (비용 계산 안 함 경고가 남음).
read_oa:
  model: claude-haiku-5-5
  effort: medium       # output_config.effort. claude-haiku-5-5 기본과 같게 적어 둠 (#134)
  max_tokens: 16000    # 11/19: 실제 tune 5건 중 3건이 8000에 닿아 JSON이 잘림 → 올림 (값은 tune 점수 뒤 다시 봄)
  prompt: prompts/f1/read_oa.md
  max_model_calls: 2   # 첫 호출 + 출력 검사 실패 때 한 번
  max_retries: 2       # 전송 오류(429·연결)를 다시 부르는 횟수
  model_input: raw     # 모델 입력 모양: raw(쪽 글자만) | tables_md(쪽 끝에 이어 붙인 표를 마크다운으로, #122)
