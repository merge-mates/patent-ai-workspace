# 인용문헌 문단 검색 색인 설정. 섹션마다 한 단계
# 색인 판. 조각 ID·DB 줄의 index_version이 된다
index_version: cite-idx-v1
# 인용문헌 PDF 폴더 (사건 폴더 아래에 PDF). 저장소 밖 data/라 git에 안 들어간다
raw_root: data/raw/cited_v2
# 파일 이름 → doc_id 표와 건너뛸 파일 (git 밖). 한국 공보(KR숫자A)는 표 없이 파일 이름이 doc_id
doc_id_table: data/processed/cite_search/file_doc_ids.yaml
# 색인 보고서를 두는 곳 (<report_dir>/<index_version>/index_report.json)
report_dir: work/cite_search

header_footer:
  # 쪽 맨 위·맨 아래에서 몇 줄까지 머리말·꼬리말 후보로 볼지
  scan_lines: 3
  # 숫자를 #로 바꾼 줄이 문헌 쪽의 이 비율 이상에서 되풀이되면 뺀다
  min_page_ratio: 0.5
  # 이 꼴로 시작하는 줄은 되풀이돼도 빼지 않는다 (식별번호·청구항 머리·도면 쪽 표지)
  keep_patterns:
    - '^[【\[]\d{4}[】\]]'
    - '^청구항\s*\d+'
    - '^【?도면\s*\d'

# 청킹 패턴. 제목 줄은 공백을 모두 뺀 글자에 맞춘다 ("명 세 서" → "명세서")
chunking:
  claims_heading: '^(특허)?청구(의)?범위$'
  abstract_heading: '^(\(57\))?요약$'
  # 대표도 줄 ("대 표 도 - 도4"): 앞 요약의 figures가 된다
  rep_figure: '^대표도[-–]?(?:도면|도)?(\d+)'
  figdesc_heading: '^도면의간단한설명$'
  # 이 제목을 만나면 청구항·요약·문단·도면 설명이 거기서 끝난다
  section_headings:
    - '^명세서$'
    - '^발명의설명$'
    - '^기술분야$'
    - '^배경기술$'
    - '^발명의배경$'
    - '^발명의내용$'
    - '^해결하려는과제$'
    - '^과제의해결수단$'
    - '^발명의효과$'
    - '^효과$'
    - '^발명을실시하기위한'
    - '^발명의실시를위한'
    - '^발명의상세한설명$'
    - '^발명의실시형태$'
    # 공백을 뺀 뒤 맞춤: <부호의 설명>, 【부호의 설명】, 도면의 주요 부분에 대한 부호의 설명
    - '^[<【(\[]?(도면의주요부분에대한)?부호의설명[>】)\]]?$'
    - '^산업상이용가능성$'

# 미국 공개공보 청킹 패턴 (두 단으로 읽은 줄에 맞춘다)
us_chunking:
  # 요약 제목 줄: 공백을 뺀 뒤 대문자로 바꾼 글자에 맞춘다 ("(57) ABSTRACT" → "(57)ABSTRACT").
  # OCR이 INID 괄호를 놓친 "57 ABSTRACT"도 받는다 (tune 문단 번호에서도 괄호를 1·I로 읽거나 놓친 꼴이 보임, 일반 규칙)
  abstract_heading: '^([(\[]?57[)\]]?)?ABSTRACT$'
  # 청구항 머리 줄 (대소문자 무시). 줄 전체가 머리여야 한다 ("We claim priority …" 본문 줄은 아님): "What is claimed is:", "We claim:" 등
  claims_heading: '^(what is claimed( is)?|what we claim( is)?|we claim|i claim|the invention claimed( is)?|.*claimed (is|are) defined as follows)\s*[:.]?$'
  # 본문 구역 제목 줄 (BACKGROUND 등 숫자·소문자 없는 대문자 줄). 만나면 앞 문단이 거기서 끝나고 제목은 버린다
  section_heading: '^[A-Z][A-Z ,;:\-–/&()''’]{2,}$'
  # 표지 서지 항목 줄 "(21) Appl. No." 꼴. 요약이 여기서 끝난다
  inid_line: '^\(\d{2}\)'
  # 문단 번호는 한 번에 이만큼 넘게 뛰지 않고, 첫 번호도 이 값 이하 ("1102 is coupled"·"2008 …" 같은 본문 숫자 거르기).
  # 50 = 한 쪽 10~15문단 × 글자층 빠짐 3~4쪽까지 받는 안전값 (판단). tune 미국 공개공보 6건은 실제 간격 최대 3이고
  # 5~100 어느 값이어도 결과가 같다 (PR #320 고침, 값을 tune에 맞추지 않음)
  max_number_jump: 50

# 미국 공보 두 단 읽기 (columns.py): 줄 묶기 높이 허용 오차와 "큰 세로 간격" 배수 (쪽 좌표 단위 pt)
us_columns:
  line_tol: 3.0
  gap_factor: 2.0

# 미국 등록공보 칼럼·줄 읽기 (columns.py). 여백 줄 번호(5, 10, ...)로 줄을 센다
us_granted:
  min_points: 3             # 줄 맞춤에 쓸 여백 숫자 최소 개수 (이보다 적은 쪽은 본문 쪽이 아님)
  x_tol: 8.0                # 여백 숫자가 여백 x에서 벗어나도 되는 폭 (pt, OCR 흔들림 여유. 판단)
  residual_limit: 1.0       # 맞춤선에서 이 줄 수 넘게 벗어난 숫자는 버린다 (OCR 오독 한 점 대비. tune 등록공보 오차 최대 0.022줄)
  gutter_x_range: [0.4, 0.6]  # 여백 숫자가 있는 x 범위 (쪽 너비 비율)
  lines_per_chunk: 15       # 조각 하나가 담는 줄 번호 폭 (1~15, 16~30, ...)

# 조각 벡터·질의 벡터 (core/llm/embed.py가 `cite_search.embed` 단계로 읽는다). cite-idx-v2 색인용
embed:
  model: text-embedding-3-small
  batch_size: 100                 # 묶음 하나 = 호출 1번
  price_per_mtok_input: 0.02      # 달러 / 입력 토큰 100만 [가정]
  max_model_calls: 200            # v4(#178) 조각 묶음 167번 + 질의 묶음에 넉넉히 (v2는 약 20번)
  max_retries: 3
