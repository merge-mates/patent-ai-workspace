# 인용문헌 문단 검색 색인 설정. 섹션마다 한 단계
# 색인 판. 조각 ID·DB 줄의 index_version이 된다
index_version: cite-idx-v1
# 인용문헌 PDF 폴더 (사건 폴더 아래에 PDF). 저장소 밖 data/라 git에 안 들어간다
raw_root: data/raw/cited_v2
# 파일 이름 → doc_id 표와 건너뛸 파일 (git 밖). 한국 공보(KR숫자A)는 표 없이 파일 이름이 doc_id
doc_id_table: data/processed/cite_search/file_doc_ids.yaml
# 색인 보고서를 두는 곳 (<report_dir>/<index_version>/index_report.json)
report_dir: work/cite_search

header_footer:
  # 쪽 맨 위·맨 아래에서 몇 줄까지 머리말·꼬리말 후보로 볼지
  scan_lines: 3
  # 숫자를 #로 바꾼 줄이 문헌 쪽의 이 비율 이상에서 되풀이되면 뺀다
  min_page_ratio: 0.5
  # 이 꼴로 시작하는 줄은 되풀이돼도 빼지 않는다 (식별번호·청구항 머리·도면 쪽 표지)
  keep_patterns:
    - '^[【\[]\d{4}[】\]]'
    - '^청구항\s*\d+'
    - '^【?도면\s*\d'

# 청킹 패턴. 제목 줄은 공백을 모두 뺀 글자에 맞춘다 ("명 세 서" → "명세서")
chunking:
  claims_heading: '^(특허)?청구(의)?범위$'
  abstract_heading: '^(\(57\))?요약$'
  # 대표도 줄 ("대 표 도 - 도4"): 앞 요약의 figures가 된다
  rep_figure: '^대표도[-–]?(?:도면|도)?(\d+)'
  figdesc_heading: '^도면의간단한설명$'
  # 이 제목을 만나면 청구항·요약·문단·도면 설명이 거기서 끝난다
  section_headings:
    - '^명세서$'
    - '^발명의설명$'
    - '^기술분야$'
    - '^배경기술$'
    - '^발명의배경$'
    - '^발명의내용$'
    - '^해결하려는과제$'
    - '^과제의해결수단$'
    - '^발명의효과$'
    - '^효과$'
    - '^발명을실시하기위한'
    - '^발명의실시를위한'
    - '^발명의상세한설명$'
    - '^발명의실시형태$'
    # 공백을 뺀 뒤 맞춤: <부호의 설명>, 【부호의 설명】, 도면의 주요 부분에 대한 부호의 설명
    - '^[<【(\[]?(도면의주요부분에대한)?부호의설명[>】)\]]?$'
    - '^산업상이용가능성$'

# 조각 벡터·질의 벡터 (core/llm/embed.py가 `cite_search.embed` 단계로 읽는다). cite-idx-v2 색인용
embed:
  model: text-embedding-3-small
  batch_size: 100                 # 묶음 하나 = 호출 1번
  price_per_mtok_input: 0.02      # 달러 / 입력 토큰 100만 [가정]
  max_model_calls: 40             # 조각 묶음 약 20번 + 질의 묶음 1번에 넉넉히
  max_retries: 3
