# 지휘 에이전트 설정 (core/agents/orchestrator.py가 읽는다)
plan: agent                         # agent = 모델이 다음 도구를 고름 / fixed_order = 아래 순서대로
# plan이 fixed_order일 때 부를 code_tool 순서: F1(extract_pages, read_oa) → F3 → F2 → F4
fixed_order: [extract_pages, read_oa, run_f3, run_f2, run_f4]
# 도구가 아직 등록되지 않았으면 "확인되지 않음"으로 넘겨도 되는 단계 (넘긴 이유와 경고가 남는다).
# 여기 없는 이름이 등록된 도구에 없으면 설정 오류로 실행이 failed가 된다 (오타를 넘기지 않게)
skip_if_missing: []                 # F2가 붙어 지금은 없음 (#28)
max_steps: 10                       # [가정] 도구 호출 최대 횟수. 아직 재 보지 않은 값
