# F4 설정. 단계 칸(direction 등)은 core/llm이 읽고, 맨 위 스위치·상한은 f4_response_draft/config.py가 읽는다.
# 가격 키: 1M 토큰당 미국 달러 (11/26 지시문 값. Haiku 5.5 $0.10/$0.50).

# 켜면(기본): 최후거절이유통지일 때 보정 프롬프트에 네 가지 제한(특허법 47조 3항)을 넣고 결과에 표시한다.
# 통지 종류를 모르면 후보에 "통지 종류 확인 필요"를 붙인다. 제한을 지켰는지는 판정하지 않는다.
# 끄면: 제한을 넣지 않고, 최후통지인 사건의 후보에 "제한을 적용하지 않은 초안, 직접 검토 필요"를 붙인다.
final_rejection_limit: true
max_units: 20        # 한 실행에서 다루는 판단 단위(묶음) 수 상한. 넘는 묶음은 부르지 않고 limit_reached로 보류 (앞 묶음만 다룸)
min_basis_chars: 10  # 명세서 근거 글자(띄어쓰기 뺀 길이) 하한. 더 짧으면 어디든 맞아 근거로 받지 않는다
max_candidates: 3    # 묶음 하나의 방향 후보 수 상한 (ADR 0001: 설정 값, 돌려 본 뒤 정함)

# 보정 프롬프트에 넣는 최초 명세서 글자. 끄면(기본) 쪽 글자 전체. 켜면 차이점 구성요소·청구항 글자와
# 겹치는 문단만 BM25 상위 top_n개를 원래 순서로 넣는다 (입력 토큰을 줄이는 실험, 이슈 #42).
# 명세서 근거 위치 대조는 켜도 원문 전체로 한다.
amendment_spec_excerpt: {enabled: false, top_n: 5}

# 켜면: 보정 초안을 먼저 만들고, 의견서가 그 묶음의 보정 결과와 F1 항별 심사관 근거(항 × 인용 × 위치)를
# 받는다 (아래 opinion_amended 단계). 끄면(기본): 방향 → 의견서(opinion) → 보정 순서 그대로.
opinion_after_amendment: false

# 끄면: 보정안 단계(amendment)를 부르지 않고, 의견서가 바깥 보정 결과(F4Input.external_amendment)로
# 묶음마다 반박(opinion_unit) + 사건 전체 한 번(opinion_case)으로 쓴다 (11/26 골 모드 P5, 보정안은 은진 담당).
# 켜면(기본): 지금 그대로 (방향 → 의견서 → 보정안).
amendment_enabled: true

direction:
  model: claude-haiku-5-5
  price_per_mtok_input: 0.10
  price_per_mtok_output: 0.50
  effort: medium
  max_tokens: 64000
  prompt: prompts/f4/direction.md
  max_model_calls: 40  # 2 × max_units: 묶음마다 첫 호출 + 출력 검사 실패 때 한 번
  max_retries: 2       # 전송 오류(429·연결)를 다시 부르는 횟수

opinion:
  model: claude-haiku-5-5
  price_per_mtok_input: 0.10
  price_per_mtok_output: 0.50
  effort: medium
  max_tokens: 64000
  prompt: prompts/f4/opinion.md
  max_model_calls: 40  # 2 × max_units: 묶음마다 첫 호출 + 출력 검사 실패 때 한 번
  max_retries: 2

# opinion_after_amendment를 켰을 때만 부르는 의견서 단계 (보정 결과·항별 심사관 근거를 받는 프롬프트)
opinion_amended:
  model: claude-haiku-5-5
  price_per_mtok_input: 0.10
  price_per_mtok_output: 0.50
  effort: medium
  max_tokens: 64000
  prompt: prompts/f4/opinion_amended.md
  max_model_calls: 40  # 2 × max_units
  max_retries: 2

amendment:
  model: claude-haiku-5-5
  price_per_mtok_input: 0.10
  price_per_mtok_output: 0.50
  effort: medium
  max_tokens: 64000
  prompt: prompts/f4/amendment.md
  max_model_calls: 40  # 2 × max_units: 묶음마다 첫 호출 + 출력 검사 실패 때 한 번
  max_retries: 2

# amendment_enabled false일 때: 묶음 하나의 반박(대응과 근거). 의견서·저지 실험은 model·effort를 실험 설정으로 바꾼다
opinion_unit:
  model: claude-haiku-5-5
  price_per_mtok_input: 0.10
  price_per_mtok_output: 0.50
  effort: medium
  max_tokens: 64000
  prompt: prompts/f4/opinion_unit.md
  system_prompt: prompts/f4/opinion_unit.system.md
  max_model_calls: 40  # 2 × max_units: 묶음마다 첫 호출 + 출력 검사 실패 때 한 번
  max_retries: 2

# amendment_enabled false일 때: 사건 전체 한 번 (지적 요지·보정 설명·마무리)
opinion_case:
  model: claude-haiku-5-5
  price_per_mtok_input: 0.10
  price_per_mtok_output: 0.50
  effort: medium
  max_tokens: 32000
  prompt: prompts/f4/opinion_case.md
  system_prompt: prompts/f4/opinion_case.system.md
  max_model_calls: 2   # 사건마다 첫 호출 + 출력 검사 실패 때 한 번
  max_retries: 2
