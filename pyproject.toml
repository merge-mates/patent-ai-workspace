[project]
name = "patent-ai"
version = "0.1.0"
description = "Patent Professional AI Workspace: 국내 OA 검토·대응 서버와 AI 코어"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "alembic>=1.14",
    "requests>=2.34.2",
    "python-dotenv>=1.2.4",
    "langgraph>=1.2.22",
    "anthropic>=2.10.0",
    "openai>=3.55.0",
    "pyyaml>=6.0.3",
    "pgvector>=0.5.1",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx>=0.28",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/patent_ai"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]  # 저장소 뿌리의 eval/ 채점기를 테스트에서 import
addopts = "-q -m 'not db'"
markers = ["db: 실제 Postgres가 필요한 테스트 (make db 뒤 make test-db, CI는 서비스 컨테이너)"]
