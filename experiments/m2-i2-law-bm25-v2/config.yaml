# 법령 BM25를 law-idx-v2에서 (#66). 조각은 v1과 같고 벡터만 더한 판이라 점수가 같아야 한다
experiment: m2-i2-law-bm25-v2
feature: retrieval
baseline: m2-i1-law-bm25-baseline   # 같은 설정, 색인만 v1 → v2
goldset: tune
goldset_version: 2
corpus: law
index_version: law-idx-v2
mode: bm25
impl: law_bm25
k: [1, 3, 5, 10]
gold: retrieval/law_gold.jsonl
law_location_rule: overlap_or_label
settings:
  tokenizer: char_bigram
  k1: 1.5
  b: 0.75
budget:
  max_usd: 0
  max_external_calls: 0
