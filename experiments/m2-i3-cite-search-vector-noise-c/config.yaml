# 인용문헌 vector 둘째 점수 (#178 C안): m2-i2 vector 설정 그대로, 색인 cite-idx-v4(C안 공보·논문 더함), 범위 B(tune 30건 풀)+C
experiment: m2-i3-cite-search-vector-noise-c
feature: retrieval
baseline: m2-i3-cite-search-bm25-noise-c   # 같은 색인·범위의 BM25
goldset: tune
goldset_version: 2   # 11/22 판 3 전에 먼저 잼 (재아 요청). 판 3 뒤 다시
corpus: cite
index_version: cite-idx-v4
mode: vector
impl: vector
k: [1, 3, 5, 10]
gold: retrieval/cite_gold.jsonl
# eval/retrieval/noise_scope.py --pool retrieval/cite_pool_bc.yaml 가 만든다 (git 밖)
noise_scope: retrieval/cite_noise_c.jsonl
settings:
  # 질의 벡터는 eval/retrieval/embed_queries로 미리 만든다 (config/cite_search.yaml embed 단계, git 밖)
  query_vectors: work/retrieval/m2-i2-cite-search-vector/query_vectors.json
budget:
  max_usd: 0.05
  max_external_calls: 40
