# 법령 BM25 기준선 (#66). 색인 law-idx-v1 = 특허법 14판·시행령 3판 조문만 (심사기준 없음)
experiment: m2-i1-law-bm25-baseline
feature: retrieval
baseline: null                # 첫 기준선
goldset: tune
goldset_version: 2
corpus: law
index_version: law-idx-v1
mode: bm25
impl: law_bm25
k: [1, 3, 5, 10]
gold: retrieval/law_gold.jsonl
law_location_rule: overlap_or_label
settings:
  tokenizer: char_bigram
  k1: 1.5
  b: 0.75
budget:
  max_usd: 0
  max_external_calls: 0
