# 인용문헌 BM25에서 질의 낱말을 한 번씩만 세기 (#117 후속, 법령과 같은 셈인지 보려고)
experiment: m2-i2-cite-search-bm25-unique-query
feature: retrieval
baseline: m2-i1-cite-search-bm25-baseline   # unique_query_terms만 false → true
goldset: tune
goldset_version: 2   # 11/19 같은이유 고침으로 2
corpus: cite
index_version: cite-idx-v1
mode: bm25
impl: bm25
k: [1, 3, 5, 10]
gold: retrieval/cite_gold.jsonl
settings:
  tokenizer: kiwi        # kiwipiepy 0.24.1
  pos_tags: [NNG, NNP, NNB, NR, VV, VA, XR, SL, SN, SH]
  bm25:                  # bm25s 0.3.16
    method: lucene
    k1: 1.5
    b: 0.75
    unique_query_terms: true
budget:
  max_usd: 0
  max_external_calls: 0
