# F3 뼈대 첫 tune 실행 (이슈 #25·#30·#31·#32). 처음 재는 것이라 이 실험이 기준선이다
experiment: m2-f3-skeleton
feature: f3
baseline: m2-f3-skeleton
goldset: tune
goldset_version: 2
impl: split_search        # config/f3.yaml impl: 구성요소 나누기 → 인용문헌별 하이브리드 검색 → LLM 대비
index_version: cite-idx-v2
k: 10
settings:                 # config/f3.yaml (실행은 그 파일을 읽는다)
  model: claude-haiku-5-5
  effort: medium
  max_tokens: 64000
  search: hybrid (RRF)    # experiments/m2-i2-cite-search-hybrid-rrf와 같은 값
  use_examiner_paragraphs: false   # 채점 실행: 심사관 지정 번호를 입력에 주지 않음 (저장소 기본값은 true)
  second_search: false
runs: 1
runner: work/overnight_1120/f3_run.py work/overnight_1120/f3/run1 --workers 4   # git 밖. F1 결과는 work/overnight_1120/f1/a3_run2_pred
budget:
  max_usd: 2.0
  max_external_calls: 800
