# 법령 BM25를 Kiwi 형태소로 (#117 후속). 인용문헌 기준선과 같은 낱말 자르기
experiment: m2-i2-law-bm25-kiwi
feature: retrieval
baseline: m2-i2-law-bm25-char-bigram   # 같은 bm25 구현, tokenizer만 char_bigram → kiwi
goldset: tune
goldset_version: 2
corpus: law
index_version: law-idx-v2
mode: bm25
impl: bm25
k: [1, 3, 5, 10]
gold: retrieval/law_gold.jsonl
law_location_rule: overlap_or_label
settings:
  tokenizer: kiwi        # kiwipiepy 0.24.1
  pos_tags: [NNG, NNP, NNB, NR, VV, VA, XR, SL, SN, SH]
  bm25:                  # bm25s 0.3.16
    method: lucene
    k1: 1.5
    b: 0.75
    unique_query_terms: true   # 긴 질의의 흔한 낱말이 여러 번 세지지 않게 (law_bm25와 같은 셈)
budget:
  max_usd: 0
  max_external_calls: 0
