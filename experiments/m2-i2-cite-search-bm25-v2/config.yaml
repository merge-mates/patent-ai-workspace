# 인용문헌 BM25를 cite-idx-v2로 다시 채점 (#67). 벡터·하이브리드와 같은 지문에서 비교하는 기준선. 설정은 m2-i1과 같다
experiment: m2-i2-cite-search-bm25-v2
feature: retrieval
baseline: m2-i1-cite-search-bm25-baseline   # 판(지문)이 달라 점수가 같은지만 본다
goldset: tune
goldset_version: 2
corpus: cite
index_version: cite-idx-v2
mode: bm25
impl: bm25
k: [1, 3, 5, 10]
gold: retrieval/cite_gold.jsonl
settings:
  tokenizer: kiwi        # kiwipiepy 0.24.1
  pos_tags: [NNG, NNP, NNB, NR, VV, VA, XR, SL, SN, SH]
  bm25:                  # bm25s 0.3.16
    method: lucene
    k1: 1.5
    b: 0.75
budget:
  max_usd: 0
  max_external_calls: 0
