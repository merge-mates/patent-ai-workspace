# F4 방향 후보를 순위 있는 후보 먼저 내게 한 프롬프트 (11/22 재아 결정 2, f3de1ae) + 주 지표를 AI 기본 선택으로 세는 채점기 (5384320). tune 같은 설정 3회. scores.json은 1회차
experiment: m3-i1-f4-rank-first
feature: f4
baseline: m3-i1-f4-first-score
goldset: tune
goldset_version: 2
gold: f4                  # data/goldsets/tune/f4/
impl: skeleton            # fix/39-f4-rank-first-order 5384320 (프롬프트 f3de1ae). 코드·설정은 first-score와 같음
settings:                 # config/f4.yaml (실행은 그 파일을 읽는다, main 9eb8237 그대로)
  model: claude-haiku-5-5
  effort: medium
  max_tokens: 64000
  max_candidates: 3
  min_basis_chars: 10
  final_rejection_limit: true   # main 기본값 (m3-f4-skeleton 때는 false)
runs: 3
runner: work/overnight_1121/scripts/f4_run.py work/overnight_1121/runs/f4rf_run<N> --workers 4 --f3-dir work/overnight_1121/runs/f3_run1 --cache-dir work/overnight_1121/runs/cache_f4rf_run<N>   # git 밖. F3 입력은 m3-i1-f3-rescore 1회차, F2 없음
budget:
  max_usd: 2.0
  max_external_calls: 300
