# 인용문헌 2단계 하이브리드 (이슈 #212): BM25 후보 100개 → 그 후보만 벡터로 다시 순위. N 50·200·노이즈 범위는 card 표 (git 밖 점수)
experiment: m3-i1-cite-search-two-stage
feature: retrieval
baseline: m2-i2-cite-search-hybrid-rrf
goldset: tune
goldset_version: 2
corpus: cite
index_version: cite-idx-v2
mode: hybrid
impl: two_stage
k: [1, 3, 5, 10]
gold: retrieval/cite_gold.jsonl
settings:
  tokenizer: kiwi        # kiwipiepy 0.24.1
  pos_tags: [NNG, NNP, NNB, NR, VV, VA, XR, SL, SN, SH]
  bm25: {method: lucene, k1: 1.5, b: 0.75}   # bm25s 0.3.16
  query_vectors: work/retrieval/m2-i2-cite-search-vector/query_vectors.json  # 벡터 실험과 같은 녹화
  two_stage:
    candidates: 100        # BM25 후보 수 N (50·100·200 중 가운데를 미리 주 설정으로 정함)
budget:
  max_usd: 0
  max_external_calls: 0
