# 인용문헌 BM25 둘째 점수 (#178 C안): 노이즈 B 설정에서 색인을 cite-idx-v4(C안 공보 115·논문 더함)로,
# 범위를 B(tune 30건 인용문헌 풀) + C(OA마다 같은 IPC·비슷한 낱말 공보 5건, 그 OA 줄에만)로 넓힌다
experiment: m2-i3-cite-search-bm25-noise-c
feature: retrieval
baseline: m2-i3-cite-search-bm25-noise-b   # 같은 검색 설정, 범위·색인만 넓힘
goldset: tune
goldset_version: 2   # 11/22 판 3 전에 먼저 잼 (재아 요청). 판 3 뒤 다시
corpus: cite
index_version: cite-idx-v4
mode: bm25
impl: bm25
k: [1, 3, 5, 10]
gold: retrieval/cite_gold.jsonl
# eval/retrieval/noise_scope.py --pool retrieval/cite_pool_bc.yaml 가 만든다 (git 밖)
noise_scope: retrieval/cite_noise_c.jsonl
settings:
  tokenizer: kiwi        # kiwipiepy 0.24.1
  pos_tags: [NNG, NNP, NNB, NR, VV, VA, XR, SL, SN, SH]
  bm25:                  # bm25s 0.3.16
    method: lucene
    k1: 1.5
    b: 0.75
budget:
  max_usd: 0
  max_external_calls: 0
