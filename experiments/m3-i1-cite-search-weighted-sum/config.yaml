# 인용문헌 점수 가중합 (이슈 #212 C3): BM25·벡터 점수를 min-max로 맞춘 뒤 0.5/0.5 가중합. 0.3·0.7·노이즈 범위는 card 표 (git 밖 점수)
experiment: m3-i1-cite-search-weighted-sum
feature: retrieval
baseline: m2-i2-cite-search-hybrid-rrf
goldset: tune
goldset_version: 2
corpus: cite
index_version: cite-idx-v2
mode: hybrid
impl: weighted_sum
k: [1, 3, 5, 10]
gold: retrieval/cite_gold.jsonl
settings:
  tokenizer: kiwi        # kiwipiepy 0.24.1
  pos_tags: [NNG, NNP, NNB, NR, VV, VA, XR, SL, SN, SH]
  bm25: {method: lucene, k1: 1.5, b: 0.75}   # bm25s 0.3.16
  query_vectors: work/retrieval/m2-i2-cite-search-vector/query_vectors.json  # 벡터 실험과 같은 녹화
  weighted_sum:
    weights: {bm25: 0.5, vector: 0.5}   # min-max 정규화 뒤 가중합 (0.3·0.5·0.7 중 가운데를 미리 주 설정으로 정함)
budget:
  max_usd: 0
  max_external_calls: 0
