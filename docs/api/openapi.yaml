# 서버 코드가 만든 생성본이다. 손으로 고치지 않는다: uv run python scripts/export_openapi.py
openapi: 3.1.0
info:
  title: Patent AI Workspace API
  version: 0.1.0
paths:
  /health:
    get:
      summary: Health
      description: '서버가 떠 있는지만 본다. DB 확인은 이슈 #55에서 더한다.'
      operationId: health_health_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
                title: Response Health Health Get
  /cases:
    get:
      summary: List Cases
      operationId: list_cases_cases_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/CaseSummary'
                type: array
                title: Response List Cases Cases Get
    post:
      summary: Create Case
      operationId: create_case_cases_post
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Body_create_case_cases_post'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreatedCase'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /cases/{case_id}:
    get:
      summary: Get Case
      operationId: get_case_cases__case_id__get
      parameters:
      - name: case_id
        in: path
        required: true
        schema:
          type: string
          title: Case Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CaseDetail'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    patch:
      summary: Patch Case
      operationId: patch_case_cases__case_id__patch
      parameters:
      - name: case_id
        in: path
        required: true
        schema:
          type: string
          title: Case Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApplicationNumberIn'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NumberEnteredOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /cases/{case_id}/materials:
    get:
      summary: Get Case Materials
      operationId: get_case_materials_cases__case_id__materials_get
      parameters:
      - name: case_id
        in: path
        required: true
        schema:
          type: string
          title: Case Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CaseMaterialsOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /cases/{case_id}/oas:
    post:
      summary: Add Oa
      operationId: add_oa_cases__case_id__oas_post
      parameters:
      - name: case_id
        in: path
        required: true
        schema:
          type: string
          title: Case Id
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Body_add_oa_cases__case_id__oas_post'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreatedOA'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /oas/{oa_id}:
    get:
      summary: Get Oa
      operationId: get_oa_oas__oa_id__get
      parameters:
      - name: oa_id
        in: path
        required: true
        schema:
          type: string
          title: Oa Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OADetail'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    patch:
      summary: Patch Oa
      operationId: patch_oa_oas__oa_id__patch
      parameters:
      - name: oa_id
        in: path
        required: true
        schema:
          type: string
          title: Oa Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DispatchNumberIn'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NumberEnteredOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /oas/{oa_id}/oa-result:
    get:
      summary: Get Oa Result
      operationId: get_oa_result_oas__oa_id__oa_result_get
      parameters:
      - name: oa_id
        in: path
        required: true
        schema:
          type: string
          title: Oa Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAResultOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /documents/{document_id}:
    get:
      summary: Get Document
      operationId: get_document_documents__document_id__get
      parameters:
      - name: document_id
        in: path
        required: true
        schema:
          type: string
          title: Document Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageText'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /cases/{case_id}/documents:
    post:
      summary: Upload Missing Document
      operationId: upload_missing_document_cases__case_id__documents_post
      parameters:
      - name: case_id
        in: path
        required: true
        schema:
          type: string
          title: Case Id
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Body_upload_missing_document_cases__case_id__documents_post'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadedMaterialOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /oas/{oa_id}/runs:
    post:
      summary: Create Run
      operationId: create_run_oas__oa_id__runs_post
      parameters:
      - name: oa_id
        in: path
        required: true
        schema:
          type: string
          title: Oa Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunCreated'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /runs/{run_id}:
    get:
      summary: Get Run
      operationId: get_run_runs__run_id__get
      parameters:
      - name: run_id
        in: path
        required: true
        schema:
          type: string
          title: Run Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunStatusOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /runs/{run_id}/cancel:
    post:
      summary: Cancel Run
      operationId: cancel_run_runs__run_id__cancel_post
      parameters:
      - name: run_id
        in: path
        required: true
        schema:
          type: string
          title: Run Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunStatusOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /oas/{oa_id}/units:
    get:
      summary: Get Units
      operationId: get_units_oas__oa_id__units_get
      parameters:
      - name: oa_id
        in: path
        required: true
        schema:
          type: string
          title: Oa Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnitsOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /oas/{oa_id}/comparisons:
    get:
      summary: Get Comparisons
      operationId: get_comparisons_oas__oa_id__comparisons_get
      parameters:
      - name: oa_id
        in: path
        required: true
        schema:
          type: string
          title: Oa Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ComparisonsOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /oas/{oa_id}/clarity-reviews:
    get:
      summary: Get Clarity Reviews
      operationId: get_clarity_reviews_oas__oa_id__clarity_reviews_get
      parameters:
      - name: oa_id
        in: path
        required: true
        schema:
          type: string
          title: Oa Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClarityReviewsOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /oas/{oa_id}/legal-evidence:
    get:
      summary: Get Legal Evidence
      operationId: get_legal_evidence_oas__oa_id__legal_evidence_get
      parameters:
      - name: oa_id
        in: path
        required: true
        schema:
          type: string
          title: Oa Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LegalEvidenceOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /oas/{oa_id}/directions:
    get:
      summary: Get Directions
      operationId: get_directions_oas__oa_id__directions_get
      parameters:
      - name: oa_id
        in: path
        required: true
        schema:
          type: string
          title: Oa Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DirectionsOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /oas/{oa_id}/drafts:
    get:
      summary: Get Drafts
      operationId: get_drafts_oas__oa_id__drafts_get
      parameters:
      - name: oa_id
        in: path
        required: true
        schema:
          type: string
          title: Oa Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DraftsOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /directions/{unit_id}/selection:
    put:
      summary: Put Selection
      operationId: put_selection_directions__unit_id__selection_put
      parameters:
      - name: unit_id
        in: path
        required: true
        schema:
          type: string
          title: Unit Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SelectionIn'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SelectionOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /oas/{oa_id}/oa-result/confirmation:
    put:
      summary: Put Confirmation
      operationId: put_confirmation_oas__oa_id__oa_result_confirmation_put
      parameters:
      - name: oa_id
        in: path
        required: true
        schema:
          type: string
          title: Oa Id
      responses:
        '200':
          description: Successful Response
