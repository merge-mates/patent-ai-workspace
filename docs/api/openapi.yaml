          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    get:
      summary: Get Confirmation
      operationId: get_confirmation_oas__oa_id__oa_result_confirmation_get
      parameters:
      - name: oa_id
        in: path
        required: true
        schema:
          type: string
          title: Oa Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfirmationOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
components:
  schemas:
    AddedSource:
      type: string
      enum:
      - other_dependent
      - spec
      - other
      title: AddedSource
      description: 부가한 구성이 어디서 왔나.
    AmendedClaim:
      properties:
        claim:
          type: integer
          title: Claim
        unit_id:
          type: string
          title: Unit Id
        before:
          type: string
          title: Before
        ai_text:
          anyOf:
          - type: string
          - type: 'null'
          title: Ai Text
        human_text:
          anyOf:
          - type: string
          - type: 'null'
          title: Human Text
        origin:
          $ref: '#/components/schemas/Origin'
          default: ai_generated
        spec_basis:
          items:
            $ref: '#/components/schemas/Evidence'
          type: array
          title: Spec Basis
        held_reason:
          anyOf:
          - type: string
          - type: 'null'
          title: Held Reason
      additionalProperties: false
      type: object
      required:
      - claim
      - unit_id
      - before
      - ai_text
      - spec_basis
      - held_reason
      title: AmendedClaim
    AmendmentCore:
      properties:
        claim:
          type: integer
          title: Claim
        kind:
          $ref: '#/components/schemas/AmendmentKind'
        source:
          anyOf:
          - $ref: '#/components/schemas/AddedSource'
          - type: 'null'
      additionalProperties: false
      type: object
      required:
      - claim
      - kind
      title: AmendmentCore
    AmendmentKind:
      type: string
      enum:
      - unchanged
      - limit
      - add
      - delete
      - correct_error
      - clarify
      title: AmendmentKind
    AmendmentLimit:
      type: string
      enum:
      - initial
      - final
      title: AmendmentLimit
    ApplicationNumberIn:
      properties:
        application_number:
          type: string
          title: Application Number
      type: object
      required:
      - application_number
      title: ApplicationNumberIn
    AsOfSource:
      type: string
      enum:
      - user_text
      - user_condition
      - oa_dispatch_date
      - none
      title: AsOfSource
    BasedOn:
      properties:
        unit_id:
          type: string
          title: Unit Id
        candidate_id:
          type: string
          title: Candidate Id
      additionalProperties: false
      type: object
      required:
      - unit_id
      - candidate_id
      title: BasedOn
      description: 이 초안을 만들 때 쓴 선택 (묶음마다 후보 하나).
    Body_add_oa_cases__case_id__oas_post:
      properties:
        file:
          type: string
          contentMediaType: application/octet-stream
          title: File
      type: object
      required:
      - file
      title: Body_add_oa_cases__case_id__oas_post
    Body_create_case_cases_post:
      properties:
        file:
          type: string
          contentMediaType: application/octet-stream
          title: File
      type: object
      required:
      - file
      title: Body_create_case_cases_post
    Body_upload_missing_document_cases__case_id__documents_post:
      properties:
        file:
          type: string
          contentMediaType: application/octet-stream
          title: File
        what:
          type: string
          title: What
      type: object
      required:
      - file
      - what
      title: Body_upload_missing_document_cases__case_id__documents_post
    Candidate_AmendmentLimit_:
      properties:
        value:
          anyOf:
          - $ref: '#/components/schemas/AmendmentLimit'
          - type: 'null'
        raw_text:
          anyOf:
          - type: string
          - type: 'null'
          title: Raw Text
        page:
          anyOf:
          - type: integer
          - type: 'null'
          title: Page
        source:
          type: string
          enum:
          - rule
          - model
          title: Source
      additionalProperties: false
      type: object
      required:
      - source
      title: Candidate[AmendmentLimit]
    Candidate_NoticeKind_:
      properties:
        value:
          anyOf:
          - $ref: '#/components/schemas/NoticeKind'
          - type: 'null'
        raw_text:
          anyOf:
          - type: string
          - type: 'null'
          title: Raw Text
        page:
          anyOf:
          - type: integer
          - type: 'null'
          title: Page
        source:
          type: string
          enum:
          - rule
          - model
          title: Source
      additionalProperties: false
      type: object
      required:
      - source
      title: Candidate[NoticeKind]
    Candidate_list_int__:
      properties:
        value:
          anyOf:
          - items:
              type: integer
            type: array
          - type: 'null'
          title: Value
        raw_text:
          anyOf:
          - type: string
          - type: 'null'
          title: Raw Text
        page:
          anyOf:
          - type: integer
          - type: 'null'
          title: Page
        source:
          type: string
          enum:
          - rule
          - model
          title: Source
      additionalProperties: false
      type: object
      required:
      - source
      title: Candidate[list[int]]
    Candidate_list_str__:
      properties:
        value:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          title: Value
        raw_text:
          anyOf:
          - type: string
          - type: 'null'
          title: Raw Text
        page:
          anyOf:
          - type: integer
          - type: 'null'
          title: Page
        source:
          type: string
          enum:
          - rule
          - model
          title: Source
      additionalProperties: false
      type: object
      required:
      - source
      title: Candidate[list[str]]
    Candidate_str_:
      properties:
        value:
          anyOf:
          - type: string
          - type: 'null'
          title: Value
        raw_text:
          anyOf:
          - type: string
          - type: 'null'
          title: Raw Text
        page:
          anyOf:
          - type: integer
          - type: 'null'
          title: Page
        source:
          type: string
          enum:
          - rule
          - model
          title: Source
      additionalProperties: false
      type: object
      required:
      - source
      title: Candidate[str]
    CaseDetail:
      properties:
        case_id:
          type: string
          title: Case Id
        case_name:
          type: string
          title: Case Name
        oas:
          items:
            $ref: '#/components/schemas/CaseOAOut'
          type: array
          title: Oas
        merged_into_case_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Merged Into Case Id
        events:
          items:
            $ref: '#/components/schemas/CaseEventOut'
          type: array
          title: Events
          default: []
        claim_versions:
          items:
            $ref: '#/components/schemas/ClaimVersionOut'
          type: array
          title: Claim Versions
          default: []
      type: object
      required:
      - case_id
      - case_name
      - oas
      title: CaseDetail
    CaseDocument:
      properties:
        document_id:
          type: string
          title: Document Id
        kind:
          type: string
          title: Kind
        source:
          type: string
          title: Source
        status:
          $ref: '#/components/schemas/Status'
        text_status:
          anyOf:
          - $ref: '#/components/schemas/Status'
          - type: 'null'
        citation_key:
          anyOf:
          - type: string
          - type: 'null'
          title: Citation Key
      additionalProperties: false
      type: object
      required:
      - document_id
      - kind
      - source
      - status
      title: CaseDocument
    CaseEventOut:
      properties:
        kind:
          type: string
          title: Kind
        doc_number:
          anyOf:
          - type: string
          - type: 'null'
          title: Doc Number
        seq:
          anyOf:
          - type: integer
          - type: 'null'
          title: Seq
      type: object
      required:
      - kind
      - doc_number
      - seq
      title: CaseEventOut
    CaseMaterials:
      properties:
        case_id:
          type: string
          title: Case Id
        documents:
          items:
            $ref: '#/components/schemas/CaseDocument'
          type: array
          title: Documents
        missing:
          items:
            $ref: '#/components/schemas/MissingMaterial'
          type: array
          title: Missing
        held_tasks:
          items:
            $ref: '#/components/schemas/HeldTask'
          type: array
          title: Held Tasks
        review_items_count:
          type: integer
          minimum: 0.0
          title: Review Items Count
          default: 0
        review_items:
          anyOf:
          - items:
              $ref: '#/components/schemas/ReviewItem'
            type: array
          - type: 'null'
          title: Review Items
      additionalProperties: false
      type: object
      required:
      - case_id
      title: CaseMaterials
    CaseMaterialsOut:
      properties:
        case_id:
          type: string
          title: Case Id
        run_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Run Id
        result:
          $ref: '#/components/schemas/CaseMaterials'
      type: object
      required:
      - case_id
      - run_id
      - result
      title: CaseMaterialsOut
    CaseOAOut:
      properties:
        oa_id:
          type: string
          title: Oa Id
        notice_kind:
          anyOf:
          - type: string
          - type: 'null'
          title: Notice Kind
        examined_claim_version:
          anyOf:
          - $ref: '#/components/schemas/ExtractedValue_str_'
          - type: 'null'
      type: object
      required:
      - oa_id
      - notice_kind
      title: CaseOAOut
    CaseSummary:
      properties:
        case_id:
          type: string
          title: Case Id
        case_name:
          type: string
          title: Case Name
        application_number:
          anyOf:
          - type: string
          - type: 'null'
          title: Application Number
        latest_oa:
          $ref: '#/components/schemas/OARefOut'
        rejection_kinds:
          items:
            type: string
          type: array
          title: Rejection Kinds
        run_state:
          type: string
          title: Run State
        status:
          type: string
          title: Status
