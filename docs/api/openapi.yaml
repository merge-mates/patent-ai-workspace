# 서버 코드가 만든 생성본이다. 손으로 고치지 않는다: uv run python scripts/export_openapi.py
openapi: 3.1.0
info:
  title: Patent AI Workspace API
  version: 0.1.0
paths:
  /health:
    get:
      summary: Health
      description: '서버가 떠 있는지만 본다. DB 확인은 이슈 #55에서 더한다.'
      operationId: health_health_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
                title: Response Health Health Get
  /cases:
    get:
      summary: List Cases
      operationId: list_cases_cases_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/CaseSummary'
                type: array
                title: Response List Cases Cases Get
    post:
      summary: Create Case
      operationId: create_case_cases_post
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Body_create_case_cases_post'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreatedCase'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /cases/{case_id}:
    get:
      summary: Get Case
      operationId: get_case_cases__case_id__get
      parameters:
      - name: case_id
        in: path
        required: true
        schema:
          type: string
          title: Case Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CaseDetail'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /cases/{case_id}/oas:
    post:
      summary: Add Oa
      operationId: add_oa_cases__case_id__oas_post
      parameters:
      - name: case_id
        in: path
        required: true
        schema:
          type: string
          title: Case Id
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Body_add_oa_cases__case_id__oas_post'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreatedOA'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /oas/{oa_id}:
    get:
      summary: Get Oa
      operationId: get_oa_oas__oa_id__get
      parameters:
      - name: oa_id
        in: path
        required: true
        schema:
          type: string
          title: Oa Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OADetail'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /oas/{oa_id}/oa-result:
    get:
      summary: Get Oa Result
      operationId: get_oa_result_oas__oa_id__oa_result_get
      parameters:
      - name: oa_id
        in: path
        required: true
        schema:
          type: string
          title: Oa Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAResultOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /oas/{oa_id}/runs:
    post:
      summary: Create Run
      operationId: create_run_oas__oa_id__runs_post
      parameters:
      - name: oa_id
        in: path
        required: true
        schema:
          type: string
          title: Oa Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunCreated'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /runs/{run_id}:
    get:
      summary: Get Run
      operationId: get_run_runs__run_id__get
      parameters:
      - name: run_id
        in: path
        required: true
        schema:
          type: string
          title: Run Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunStatusOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /runs/{run_id}/cancel:
    post:
      summary: Cancel Run
      operationId: cancel_run_runs__run_id__cancel_post
      parameters:
      - name: run_id
        in: path
        required: true
        schema:
          type: string
          title: Run Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunStatusOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
components:
  schemas:
    Body_add_oa_cases__case_id__oas_post:
      properties:
        file:
          type: string
          contentMediaType: application/octet-stream
          title: File
      type: object
      required:
      - file
      title: Body_add_oa_cases__case_id__oas_post
    Body_create_case_cases_post:
      properties:
        file:
          type: string
          contentMediaType: application/octet-stream
          title: File
      type: object
      required:
      - file
      title: Body_create_case_cases_post
    Candidate_NoticeKind_:
      properties:
        value:
          anyOf:
          - $ref: '#/components/schemas/NoticeKind'
          - type: 'null'
        raw_text:
          anyOf:
          - type: string
          - type: 'null'
          title: Raw Text
        page:
          anyOf:
          - type: integer
          - type: 'null'
          title: Page
        source:
          type: string
          enum:
          - rule
          - model
          title: Source
      additionalProperties: false
      type: object
      required:
      - source
      title: Candidate[NoticeKind]
    Candidate_list_int__:
      properties:
        value:
          anyOf:
          - items:
              type: integer
            type: array
          - type: 'null'
          title: Value
        raw_text:
          anyOf:
          - type: string
          - type: 'null'
          title: Raw Text
        page:
          anyOf:
          - type: integer
          - type: 'null'
          title: Page
        source:
          type: string
          enum:
          - rule
          - model
          title: Source
      additionalProperties: false
      type: object
      required:
      - source
      title: Candidate[list[int]]
    Candidate_list_str__:
      properties:
        value:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          title: Value
        raw_text:
          anyOf:
          - type: string
          - type: 'null'
          title: Raw Text
        page:
          anyOf:
          - type: integer
          - type: 'null'
          title: Page
        source:
          type: string
          enum:
          - rule
          - model
          title: Source
      additionalProperties: false
      type: object
      required:
      - source
      title: Candidate[list[str]]
    Candidate_str_:
      properties:
        value:
          anyOf:
          - type: string
          - type: 'null'
          title: Value
        raw_text:
          anyOf:
          - type: string
          - type: 'null'
          title: Raw Text
        page:
          anyOf:
          - type: integer
          - type: 'null'
          title: Page
        source:
          type: string
          enum:
          - rule
          - model
          title: Source
      additionalProperties: false
      type: object
      required:
      - source
      title: Candidate[str]
    CaseDetail:
      properties:
        case_id:
          type: string
          title: Case Id
        case_name:
          type: string
          title: Case Name
        oas:
          items:
            $ref: '#/components/schemas/OARefOut'
          type: array
          title: Oas
      type: object
      required:
      - case_id
      - case_name
      - oas
      title: CaseDetail
    CaseSummary:
      properties:
        case_id:
          type: string
          title: Case Id
        case_name:
          type: string
          title: Case Name
        application_number:
          anyOf:
          - type: string
          - type: 'null'
          title: Application Number
        latest_oa:
          $ref: '#/components/schemas/OARefOut'
        rejection_kinds:
          items:
            type: string
          type: array
          title: Rejection Kinds
        run_state:
          type: string
          title: Run State
        status:
          type: string
          title: Status
        review_items_count:
          anyOf:
          - type: integer
          - type: 'null'
          title: Review Items Count
        updated_at:
          type: string
          format: date-time
          title: Updated At
      type: object
      required:
      - case_id
      - case_name
      - application_number
      - latest_oa
      - rejection_kinds
      - run_state
      - status
      - review_items_count
      - updated_at
      title: CaseSummary
    Citation:
      properties:
        label:
          type: string
          title: Label
        number:
          $ref: '#/components/schemas/ExtractedValue_str_'
        country:
          $ref: '#/components/schemas/ExtractedValue_str_'
        country_supported:
          type: boolean
          title: Country Supported
        cited_paragraphs:
          $ref: '#/components/schemas/ExtractedValue_list_str__'
        flags:
          items:
            $ref: '#/components/schemas/Flag'
          type: array
          title: Flags
      additionalProperties: false
      type: object
      required:
      - label
      - number
      - country
      - country_supported
      - cited_paragraphs
      title: Citation
    ClaimRow:
      properties:
        claim:
          anyOf:
          - type: integer
          - type: 'null'
          title: Claim
        rejection:
          anyOf:
          - type: integer
          - type: 'null'
          title: Rejection
        citations:
          items:
            type: string
          type: array
          title: Citations
        locations:
          additionalProperties:
            items:
              type: string
            type: array
          type: object
          title: Locations
        same_as:
          items:
            type: string
          type: array
          title: Same As
        clarity_terms:
          items:
            type: string
          type: array
          title: Clarity Terms
        clarity_reason:
          anyOf:
          - type: string
          - type: 'null'
          title: Clarity Reason
        clarity_reason_origin:
          anyOf:
          - $ref: '#/components/schemas/Origin'
          - type: 'null'
        no_location:
          anyOf:
          - type: string
          - type: 'null'
          title: No Location
        raw_text:
          anyOf:
          - type: string
          - type: 'null'
          title: Raw Text
        page:
          anyOf:
          - type: integer
          - type: 'null'
          title: Page
        status:
          $ref: '#/components/schemas/Status'
      additionalProperties: false
      type: object
      required:
      - claim
      - rejection
      - status
      title: ClaimRow
      description: '청구항 줄 하나 = 청구항 x 거절이유 (정답 형식 2.4, 채점 단위).


        값은 원문 대조를 통과했을 때만 둔다. 대조에 떨어지면 status가 unverified이고 값은 비어 있다

        (청구항·거절이유 번호만 어느 줄인지 알리려고 남길 수 있음).'
    CreatedCase:
      properties:
        case_id:
          type: string
          title: Case Id
        oa_id:
          type: string
          title: Oa Id
        run_id:
          type: string
          title: Run Id
      type: object
      required:
      - case_id
      - oa_id
      - run_id
      title: CreatedCase
    CreatedOA:
      properties:
        oa_id:
          type: string
          title: Oa Id
        run_id:
          type: string
          title: Run Id
      type: object
      required:
      - oa_id
      - run_id
      title: CreatedOA
    Evidence:
      properties:
        document_id:
          type: string
          title: Document Id
        page:
          anyOf:
          - type: integer
          - type: 'null'
          title: Page
        raw_text:
          anyOf:
          - type: string
          - type: 'null'
          title: Raw Text
        edition:
          anyOf:
          - type: string
          - type: 'null'
          title: Edition
        checked_on:
          anyOf:
          - type: string
            format: date
          - type: 'null'
          title: Checked On
      additionalProperties: false
      type: object
      required:
      - document_id
      title: Evidence
      description: 근거 위치. 화면이 그 쪽 text에서 raw_text를 찾아 강조한다.
    ExaminerHints:
      properties:
        allowable_claims:
          $ref: '#/components/schemas/ExtractedValue_list_int__'
        amendment_note:
          $ref: '#/components/schemas/ExtractedValue_str_'
      additionalProperties: false
      type: object
      required:
      - allowable_claims
      - amendment_note
      title: ExaminerHints
    ExtractedValue_NoticeKind_:
      properties:
        value:
          anyOf:
          - $ref: '#/components/schemas/NoticeKind'
          - type: 'null'
        raw_text:
          anyOf:
          - type: string
          - type: 'null'
          title: Raw Text
        page:
          anyOf:
          - type: integer
          - type: 'null'
          title: Page
        status:
          $ref: '#/components/schemas/Status'
        candidates:
          items:
            $ref: '#/components/schemas/Candidate_NoticeKind_'
          type: array
          title: Candidates
      additionalProperties: false
      type: object
      required:
      - status
      title: ExtractedValue[NoticeKind]
    ExtractedValue_list_int__:
      properties:
        value:
          anyOf:
          - items:
              type: integer
            type: array
          - type: 'null'
          title: Value
        raw_text:
          anyOf:
          - type: string
          - type: 'null'
          title: Raw Text
        page:
          anyOf:
          - type: integer
          - type: 'null'
          title: Page
        status:
          $ref: '#/components/schemas/Status'
        candidates:
          items:
            $ref: '#/components/schemas/Candidate_list_int__'
          type: array
          title: Candidates
      additionalProperties: false
      type: object
      required:
      - status
      title: ExtractedValue[list[int]]
    ExtractedValue_list_str__:
      properties:
        value:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          title: Value
        raw_text:
          anyOf:
          - type: string
          - type: 'null'
          title: Raw Text
        page:
          anyOf:
          - type: integer
          - type: 'null'
          title: Page
        status:
          $ref: '#/components/schemas/Status'
        candidates:
          items:
            $ref: '#/components/schemas/Candidate_list_str__'
          type: array
          title: Candidates
      additionalProperties: false
      type: object
      required:
      - status
      title: ExtractedValue[list[str]]
    ExtractedValue_str_:
      properties:
        value:
          anyOf:
          - type: string
          - type: 'null'
          title: Value
        raw_text:
          anyOf:
          - type: string
          - type: 'null'
          title: Raw Text
        page:
          anyOf:
          - type: integer
          - type: 'null'
          title: Page
        status:
          $ref: '#/components/schemas/Status'
        candidates:
          items:
            $ref: '#/components/schemas/Candidate_str_'
          type: array
          title: Candidates
      additionalProperties: false
      type: object
      required:
      - status
      title: ExtractedValue[str]
    Flag:
      type: string
      enum:
      - needs_human_judgment
      - needs_human_review
      title: Flag
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    LatestRun:
      properties:
        run_id:
          type: string
          title: Run Id
        state:
          type: string
          title: State
        current_step:
          anyOf:
          - type: string
          - type: 'null'
          title: Current Step
      type: object
      required:
      - run_id
      - state
      - current_step
      title: LatestRun
    NoticeKind:
      type: string
      enum:
      - initial
      - final
      - unknown
      title: NoticeKind
      description: 통지 종류. 정답 형식(f1-oa-gold.md)과 같은 코드.
    OADetail:
      properties:
        oa_id:
          type: string
          title: Oa Id
        case_id:
          type: string
          title: Case Id
        case_name:
          type: string
          title: Case Name
        document_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Document Id
        latest_run:
          anyOf:
          - $ref: '#/components/schemas/LatestRun'
          - type: 'null'
        dispatch_number:
          anyOf:
          - type: string
          - type: 'null'
          title: Dispatch Number
      type: object
      required:
      - oa_id
      - case_id
      - case_name
      - document_id
      - latest_run
      - dispatch_number
      title: OADetail
    OARefOut:
      properties:
        oa_id:
          type: string
          title: Oa Id
        notice_kind:
          anyOf:
          - type: string
          - type: 'null'
          title: Notice Kind
      type: object
      required:
      - oa_id
      - notice_kind
      title: OARefOut
    OAResult:
      properties:
        status:
          $ref: '#/components/schemas/Status'
        evidence:
          items:
            $ref: '#/components/schemas/Evidence'
          type: array
          title: Evidence
        origin:
          $ref: '#/components/schemas/Origin'
          default: ai_generated
        needs_recheck:
          type: boolean
          title: Needs Recheck
          default: false
        recheck_reason:
          anyOf:
          - type: string
          - type: 'null'
          title: Recheck Reason
        flags:
          items:
            $ref: '#/components/schemas/Flag'
          type: array
          title: Flags
        oa_id:
          type: string
          title: Oa Id
        application_number:
          $ref: '#/components/schemas/ExtractedValue_str_'
        dispatch_number:
          $ref: '#/components/schemas/ExtractedValue_str_'
        notice_date:
          $ref: '#/components/schemas/ExtractedValue_str_'
        response_due:
          $ref: '#/components/schemas/ExtractedValue_str_'
        notice_kind:
          $ref: '#/components/schemas/ExtractedValue_NoticeKind_'
        examined_claims:
          $ref: '#/components/schemas/ExtractedValue_list_int__'
        examined_claim_version:
          anyOf:
          - $ref: '#/components/schemas/ExtractedValue_str_'
          - type: 'null'
        examiner_hints:
          $ref: '#/components/schemas/ExaminerHints'
        rejections:
          items:
            $ref: '#/components/schemas/Rejection'
          type: array
          title: Rejections
        claim_rows:
          items:
            $ref: '#/components/schemas/ClaimRow'
          type: array
          title: Claim Rows
      additionalProperties: false
      type: object
      required:
      - status
      - oa_id
      - application_number
      - dispatch_number
      - notice_date
      - response_due
      - notice_kind
      - examined_claims
      - examiner_hints
      title: OAResult
    OAResultOut:
      properties:
        oa_id:
          type: string
          title: Oa Id
        run_id:
          type: string
          title: Run Id
        status:
          type: string
          title: Status
        result:
          $ref: '#/components/schemas/OAResult'
      type: object
      required:
      - oa_id
      - run_id
      - status
      - result
      title: OAResultOut
    Origin:
      type: string
      enum:
      - ai_generated
      - ai_default
      - human_selected
      - human_edited
      title: Origin
    Rejection:
      properties:
        status:
          $ref: '#/components/schemas/Status'
        evidence:
          items:
            $ref: '#/components/schemas/Evidence'
          type: array
          title: Evidence
        origin:
          $ref: '#/components/schemas/Origin'
          default: ai_generated
        needs_recheck:
          type: boolean
          title: Needs Recheck
          default: false
        recheck_reason:
          anyOf:
          - type: string
          - type: 'null'
          title: Recheck Reason
        flags:
          items:
            $ref: '#/components/schemas/Flag'
          type: array
          title: Flags
        'no':
          type: integer
          title: 'No'
        kind:
          $ref: '#/components/schemas/RejectionKind'
        article:
          $ref: '#/components/schemas/ExtractedValue_str_'
        supported:
          type: boolean
          title: Supported
        claims:
          $ref: '#/components/schemas/ExtractedValue_list_int__'
        citations:
          items:
            $ref: '#/components/schemas/Citation'
          type: array
          title: Citations
        examiner_reasoning:
          $ref: '#/components/schemas/ExtractedValue_str_'
      additionalProperties: false
      type: object
      required:
      - status
      - 'no'
      - kind
      - article
      - supported
      - claims
      - examiner_reasoning
      title: Rejection
      description: 거절이유 하나. 청구항은 거절이유마다 따로 둔다 (합치지 않음).
    RejectionKind:
      type: string
      enum:
      - novelty
      - inventive_step
      - clarity
      - other
      title: RejectionKind
      description: 거절이유 종류. 정답 형식(f1-oa-gold.md 4절 `kind`)과 같은 코드.
    RunCreated:
      properties:
        run_id:
          type: string
          title: Run Id
      type: object
      required:
      - run_id
      title: RunCreated
    RunErrorOut:
      properties:
        code:
          type: string
          title: Code
        message:
          type: string
          title: Message
      type: object
      required:
      - code
      - message
      title: RunErrorOut
    RunStatusOut:
      properties:
        run_id:
          type: string
          title: Run Id
        oa_id:
          type: string
          title: Oa Id
        state:
          type: string
          title: State
        current_step:
          anyOf:
          - type: string
          - type: 'null'
          title: Current Step
        waiting_for:
          anyOf:
          - type: string
          - type: 'null'
          title: Waiting For
        error:
          anyOf:
          - $ref: '#/components/schemas/RunErrorOut'
          - type: 'null'
      type: object
      required:
      - run_id
      - oa_id
      - state
      - current_step
      - error
      title: RunStatusOut
    Status:
      properties:
        value:
          $ref: '#/components/schemas/StatusValue'
        reason:
          anyOf:
          - $ref: '#/components/schemas/UnverifiedReason'
          - type: 'null'
        checked:
          anyOf:
          - type: string
          - type: 'null'
          title: Checked
        searched_scope:
          anyOf:
          - type: string
          - type: 'null'
