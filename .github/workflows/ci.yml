# PR마다 테스트·린트 (ADR 0003 CI). 테스트는 네트워크·API 키 없이 돈다.
name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3  # v8부터 메이저 태그(v10)가 없다
      - run: uv sync --frozen
      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: uv run pytest

  python-db:
    # @pytest.mark.db 테스트: 실제 Postgres(pgvector)에 마이그레이션을 올려 본다.
    runs-on: ubuntu-latest
    services:
      db:
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_USER: patent
          POSTGRES_PASSWORD: patent
          POSTGRES_DB: patent_ai
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U patent -d patent_ai"
          --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      DATABASE_URL: postgresql+psycopg://patent:patent@localhost:5432/patent_ai
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3  # v8부터 메이저 태그(v10)가 없다
      - run: uv sync --frozen
      - run: uv run pytest -m db

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker compose config -q
