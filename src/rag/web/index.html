<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>특허법령 검색 챗봇</title>
<style>
  /* 색은 변수로 두고 다크 모드에서 바꾼다. 구조와 입력 처리는 이전에 만든 간단한 챗봇 실습 화면을 참고했다. */
  :root {
    --bg: #f6f7f9; --surface: #ffffff; --text: #1c2430; --muted: #5d6b7c; --border: #dde2e9;
    --accent: #2457c5; --accent-text: #ffffff; --user-bg: #2457c5; --user-text: #ffffff;
    --err-bg: #fdecec; --err-text: #8a1c1c; --chip-bg: #eef2fb;
    --warn-bg: #fff6e0; --warn-text: #7a5200; --none-bg: #f1f3f6; --none-text: #3a4656;
    --overlay: rgba(10, 14, 22, .55);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #12161c; --surface: #1b212a; --text: #e6eaf0; --muted: #97a3b3; --border: #2b3340;
      --accent: #6f9bff; --accent-text: #0c1220; --user-bg: #2f4f93; --user-text: #f2f5fb;
      --err-bg: #3a1f22; --err-text: #ffb4b4; --chip-bg: #232b38;
      --warn-bg: #3a3017; --warn-text: #f3cf7a; --none-bg: #242b36; --none-text: #c9d2de;
    }
  }
  :root[data-theme="dark"] {
    --bg: #12161c; --surface: #1b212a; --text: #e6eaf0; --muted: #97a3b3; --border: #2b3340;
    --accent: #6f9bff; --accent-text: #0c1220; --user-bg: #2f4f93; --user-text: #f2f5fb;
    --err-bg: #3a1f22; --err-text: #ffb4b4; --chip-bg: #232b38;
    --warn-bg: #3a3017; --warn-text: #f3cf7a; --none-bg: #242b36; --none-text: #c9d2de;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 16px/1.6 -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", "Segoe UI", sans-serif;
    display: flex; flex-direction: column; align-items: center;
  }
  header, main, form { width: 100%; max-width: 760px; padding-left: 16px; padding-right: 16px; }
  header { padding-top: 20px; padding-bottom: 8px; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  .notice { margin: 0; font-size: 14px; color: var(--muted); }
  main { flex: 1; overflow-y: auto; padding-top: 12px; padding-bottom: 12px; display: flex; flex-direction: column; gap: 12px; }
  .empty { color: var(--muted); font-size: 15px; margin: auto 0; text-align: center; }
  .msg { max-width: 92%; padding: 10px 14px; border-radius: 14px; white-space: pre-wrap; overflow-wrap: anywhere; }
  .msg.user { align-self: flex-end; background: var(--user-bg); color: var(--user-text); border-bottom-right-radius: 4px; }
  .msg.bot { align-self: flex-start; background: var(--surface); border: 1px solid var(--border); border-bottom-left-radius: 4px; }
  .msg.bot.md { white-space: normal; }
  .md > p { margin: 0 0 .6em; }
  .md > p:last-of-type { margin-bottom: 0; }
  .md > ul, .md > ol, .md li > ul, .md li > ol { margin: .2em 0 .6em; padding-left: 1.4em; }
  .md li { margin: .15em 0; }
  .msg.bot.pending { color: var(--muted); }
  .msg.bot.error { background: var(--err-bg); color: var(--err-text); border-color: transparent; }
  .badge { display: block; margin: 0 0 8px; padding: 6px 10px; border-radius: 8px; font-size: 14px; font-weight: 600; white-space: normal; }
  .badge.partial { background: var(--warn-bg); color: var(--warn-text); }
  .badge.no_basis { background: var(--none-bg); color: var(--none-text); }
  .sources { margin-top: 10px; padding-top: 8px; border-top: 1px solid var(--border); white-space: normal; }
  .sources .title { font-size: 13px; color: var(--muted); margin-bottom: 6px; }
  .sources ul { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 6px; }
  .chip {
    font: inherit; font-size: 13px; font-weight: 500; background: var(--chip-bg); color: var(--accent);
    border: 1px solid var(--border); border-radius: 999px; padding: 3px 12px; cursor: pointer;
  }
  .chip:hover { border-color: var(--accent); }
  form { display: flex; gap: 8px; padding-top: 8px; padding-bottom: 16px; }
  textarea {
    flex: 1; resize: none; font: inherit; color: var(--text); background: var(--surface);
    border: 1px solid var(--border); border-radius: 12px; padding: 10px 12px; max-height: 160px;
  }
  textarea:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  button.send {
    font: inherit; font-weight: 600; background: var(--accent); color: var(--accent-text);
    border: 0; border-radius: 12px; padding: 0 18px; cursor: pointer;
  }
  .ai-note { width: 100%; max-width: 760px; margin: 0; padding: 0 16px 14px; font-size: 12px; color: var(--muted); text-align: center; }
  .ai-note i { font-style: normal; }
  button:disabled { opacity: .5; cursor: not-allowed; }

  /* 조문 원문 패널(대화상자): 휴대폰에서는 화면 아래에서 올라오고 스크롤된다 */
  #overlay { position: fixed; inset: 0; background: var(--overlay); display: none; align-items: center; justify-content: center; padding: 16px; z-index: 10; }
  #overlay.open { display: flex; }
  #panel {
    width: 100%; max-width: 640px; max-height: 86vh; display: flex; flex-direction: column;
    background: var(--surface); color: var(--text); border: 1px solid var(--border); border-radius: 14px;
  }
  #panel header { display: flex; align-items: flex-start; gap: 12px; padding: 14px 16px 8px; max-width: none; width: auto; }
  #panel h2 { flex: 1; font-size: 17px; margin: 0; }
  #panel .meta { padding: 0 16px 8px; font-size: 13px; color: var(--muted); }
  #panel .article { padding: 0 16px 16px; overflow-y: auto; white-space: pre-wrap; overflow-wrap: anywhere; font-size: 15px; }
  #panel .close { font: inherit; background: transparent; color: var(--muted); border: 1px solid var(--border); border-radius: 8px; padding: 2px 10px; cursor: pointer; }
  @media (max-width: 560px) { #overlay { align-items: flex-end; padding: 0; } #panel { max-width: none; border-radius: 14px 14px 0 0; max-height: 80vh; } }
</style>
</head>
<body>
<header>
  <h1>특허법령 검색 챗봇</h1>
  <p class="notice">특허법·시행령·시행규칙 기준</p>
</header>
<main id="log" aria-live="polite">
  <p class="empty" id="empty">특허법령에 대해 궁금한 점을 물어보세요.<br>예: 특허출원 전에 내가 발표한 논문이 있어도 특허를 받을 수 있나요?<br><br>답변에 인용된 조문을 누르면 원문을 볼 수 있어요.<br>상표·디자인·판례 등은 다루지 않으며, 조문에서 근거를 찾지 못하면 그렇게 알려 드립니다.<br><br><strong>질문마다 독립적으로 처리됩니다.</strong><br>앞 질문을 이어서 묻지 말고 전체 문장으로 입력해 주세요.</p>
</main>
<form id="form">
  <textarea id="input" rows="1" maxlength="1000" placeholder="질문을 입력하세요 (Enter 전송)" title="Enter 전송, Shift+Enter 줄바꿈" aria-label="질문"></textarea>
  <button class="send" id="send" type="submit">보내기</button>
</form>
<p class="ai-note"><i aria-hidden="true">ⓘ</i> AI 답변입니다. 중요한 결정 전에는 변리사 확인이 필요합니다.</p>

<div id="overlay" aria-hidden="true">
  <div id="panel" role="dialog" aria-modal="true" aria-labelledby="panel-title">
    <header>
      <h2 id="panel-title"></h2>
      <button class="close" id="panel-close" type="button">닫기</button>
    </header>
    <div class="meta" id="panel-meta"></div>
    <div class="article" id="panel-text" tabindex="0"></div>
  </div>
</div>

<script src="/md.js"></script>
<script>
(function () {
  var log = document.getElementById("log");
  var form = document.getElementById("form");
  var input = document.getElementById("input");
  var send = document.getElementById("send");
  var empty = document.getElementById("empty");
  var overlay = document.getElementById("overlay");
  var panelTitle = document.getElementById("panel-title");
  var panelMeta = document.getElementById("panel-meta");
  var panelText = document.getElementById("panel-text");
  var panelClose = document.getElementById("panel-close");
  var busy = false;
  var lastChip = null;  // 원문 패널을 닫으면 포커스를 돌려줄 칩

  function bubble(kind, text) {
    if (empty) { empty.remove(); empty = null; }
    var el = document.createElement("div");
    el.className = "msg " + kind;
    el.textContent = text;
    log.appendChild(el);
    log.scrollTop = log.scrollHeight;
    return el;
  }

  // 답변(마크다운)을 요소로 그린다. 모든 글은 textContent/createTextNode 로만 넣는다(HTML 해석 없음).
  function addInline(parent, parts) {
    parts.forEach(function (p) {
      if (p.t === "br") parent.appendChild(document.createElement("br"));
      else if (p.t === "strong") { var s = document.createElement("strong"); s.textContent = p.v; parent.appendChild(s); }
      else parent.appendChild(document.createTextNode(p.v));
    });
  }
  function buildList(l) {
    var el = document.createElement(l.type);
    if (l.type === "ol" && l.start !== 1) el.start = l.start;
    l.items.forEach(function (it) {
      var li = document.createElement("li");
      addInline(li, it.inline);
      if (it.children) li.appendChild(buildList(it.children));
      el.appendChild(li);
    });
    return el;
  }
  function renderMarkdown(el, text) {
    if (typeof parseMarkdown !== "function") { el.appendChild(document.createTextNode(text)); return; }  // md.js 를 못 불러오면 글자 그대로
    parseMarkdown(text).forEach(function (b) {
      if (b.type === "p") { var p = document.createElement("p"); addInline(p, b.inline); el.appendChild(p); }
      else el.appendChild(buildList(b));
    });
  }

  // 답변 상태 표시: 일부만 근거가 있거나(partial) 근거를 못 찾은(no_basis) 답은 일반 답변처럼 보이지 않게 한다.
  var BADGES = {
    partial: "⚠ 제공된 조문으로는 일부만 확인된 답변입니다. 확실하지 않은 부분은 직접 확인하세요.",
    no_basis: "조문에서 근거를 찾지 못했습니다. 규정이 없다는 뜻은 아닙니다."
  };
  function showBadge(el, status) {
    if (!BADGES[status]) return;
    var b = document.createElement("span");
    b.className = "badge " + status;
    b.textContent = BADGES[status];
    el.appendChild(b);
  }

  function openPanel(label, id, chip) {
    lastChip = chip;
    panelTitle.textContent = label;
    panelMeta.textContent = "";
    panelText.textContent = "불러오는 중…";
    overlay.classList.add("open");
    overlay.setAttribute("aria-hidden", "false");
    panelClose.focus();
    fetch("/api/article?id=" + encodeURIComponent(id))
      .then(function (res) { if (!res.ok) throw new Error("원문을 찾을 수 없습니다."); return res.json(); })
      .then(function (a) {
        panelTitle.textContent = a.title ? a.label + " (" + a.title + ")" : a.label;
        panelMeta.textContent = (a.chapter ? a.chapter + " · " : "") + a.source;
        panelText.textContent = a.text;
      })
      .catch(function (err) { panelText.textContent = "오류: " + ((err && err.message) || "원문을 불러오지 못했습니다."); });
  }
  function closePanel() {
    overlay.classList.remove("open");
    overlay.setAttribute("aria-hidden", "true");
    if (lastChip) lastChip.focus();
  }
  panelClose.addEventListener("click", closePanel);
  overlay.addEventListener("click", function (e) { if (e.target === overlay) closePanel(); });
  document.addEventListener("keydown", function (e) { if (e.key === "Escape" && overlay.classList.contains("open")) closePanel(); });

  function showSources(el, citations) {
    if (!citations || !citations.length) return;
    var box = document.createElement("div");
    box.className = "sources";
    var title = document.createElement("div");
    title.className = "title";
    title.textContent = "답변에 인용된 조문 (눌러서 원문 보기)";
    var ul = document.createElement("ul");
    citations.forEach(function (c) {
      var li = document.createElement("li");
      var chip = document.createElement("button");
      chip.type = "button";
      chip.className = "chip";
      chip.textContent = c.label;
      chip.addEventListener("click", function () { openPanel(c.label, c.article_id, chip); });
      li.appendChild(chip);
      ul.appendChild(li);
    });
    box.appendChild(title);
    box.appendChild(ul);
    el.appendChild(box);
  }

  async function ask(message) {
    busy = true;
    send.disabled = true;
    bubble("user", message);
    var pending = bubble("bot pending", "찾는 중… (보통 15~20초 걸립니다)");
    try {
      var res = await fetch("/api/ask", {
        method: "POST",
        headers: { "content-type": "application/json" },
        body: JSON.stringify({ message: message })  // 질문마다 독립 처리: history 는 보내지 않는다
      });
      var data = await res.json();
      if (!res.ok) throw new Error(data.error || "요청에 실패했습니다.");
      if (data.status === "error") throw new Error("답변을 만들지 못했습니다. 질문을 바꿔 다시 시도해 주세요.");
      pending.className = "msg bot md";
      pending.textContent = "";
      showBadge(pending, data.status);
      renderMarkdown(pending, String(data.answer_display));
      showSources(pending, data.citations);
    } catch (err) {
      pending.className = "msg bot error";
      var reason = err instanceof TypeError ? "서버에 연결할 수 없습니다. 서버가 실행 중인지 확인하세요."
        : err instanceof SyntaxError ? "서버 응답을 해석하지 못했습니다."
        : (err && err.message) || "요청에 실패했습니다.";
      pending.textContent = "오류: " + reason;
    } finally {
      busy = false;
      send.disabled = false;
      log.scrollTop = log.scrollHeight;
      input.focus();
    }
  }

  function submit() {
    var message = input.value.trim();
    if (!message || busy) return;
    input.value = "";
    input.style.height = "auto";
    ask(message);
  }

  form.addEventListener("submit", function (e) { e.preventDefault(); submit(); });
  input.addEventListener("keydown", function (e) {
    if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); submit(); }
  });
  input.addEventListener("input", function () {
    input.style.height = "auto";
    input.style.height = Math.min(input.scrollHeight, 160) + "px";
  });
})();
</script>
</body>
</html>
